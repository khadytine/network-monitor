<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitor - Dashboard Distribué</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .instance-info {
            background: #e8f4f8;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .instance-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .instance-item {
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #3498db;
        }

        .instance-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .instance-status {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-active {
            background: #27ae60;
            color: white;
        }

        .status-inactive {
            background: #e74c3c;
            color: white;
        }

        .add-service-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-service-form input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .add-service-form input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn:hover {
            background: #2980b9;
        }

        .events-log {
            max-height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 5px;
            padding: 10px;
        }

        .event-item {
            background: white;
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #3498db;
            font-size: 0.9em;
        }

        .event-time {
            color: #7f8c8d;
            font-size: 0.8em;
        }

        .communication-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .communication-form select,
        .communication-form input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .communication-form select:focus,
        .communication-form input:focus {
            outline: none;
            border-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Network Monitor - Dashboard Distribué</h1>
            <p>Système de monitoring réseau avec communication inter-instances</p>
            <div class="instance-info" id="instanceInfo">
                Chargement des informations de l'instance...
            </div>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>Instances Actives</h2>
                <div class="instance-list" id="instanceList">
                    <!-- Instances will be loaded here -->
                </div>
            </div>

            <div class="card">
                <h2>Communication Inter-Instances</h2>
                <div class="communication-form">
                    <select id="targetInstance">
                        <option value="">Sélectionner une instance...</option>
                    </select>
                    <input type="text" id="message" placeholder="Message à envoyer">
                    <button class="btn" onclick="sendMessage()">Envoyer</button>
                </div>
                <div class="service-list">
                    <h3>Services Monitorés</h3>
                    <div id="serviceList">
                        <!-- Services will be loaded here -->
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Événements Réseau</h2>
                <div class="events-log" id="eventsLog">
                    <!-- Events will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let instances = [];
        let services = [];
        let events = [];
        let currentInstance = {};

        // Load current instance info
        async function loadInstanceInfo() {
            try {
                const response = await fetch('/health');
                currentInstance = await response.json();
                document.getElementById('instanceInfo').innerHTML = `
                    <strong>Instance:</strong> ${currentInstance.instance_id} | 
                    <strong>URL:</strong> ${currentInstance.instance_url} | 
                    <strong>Statut:</strong> ${currentInstance.status}
                `;
            } catch (error) {
                console.error('Error loading instance info:', error);
            }
        }

        // Load all data
        async function loadData() {
            try {
                const [instancesResponse, servicesResponse, eventsResponse] = await Promise.all([
                    fetch('/api/instances'),
                    fetch('/api/services'),
                    fetch('/api/network-events')
                ]);
                
                instances = await instancesResponse.json();
                services = await servicesResponse.json();
                events = await eventsResponse.json();
                
                renderInstances();
                renderServices();
                renderEvents();
                updateTargetSelect();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        // Render instances
        function renderInstances() {
            const list = document.getElementById('instanceList');
            list.innerHTML = '';
            
            instances.forEach(instance => {
                const item = document.createElement('div');
                item.className = 'instance-item';
                const isActive = instance.status === 'active';
                item.innerHTML = `
                    <div class="instance-name">${instance.name}</div>
                    <div class="instance-status">
                        <span>URL: ${instance.url}</span>
                        <span class="status-badge status-${isActive ? 'active' : 'inactive'}">${instance.status}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Render services
        function renderServices() {
            const list = document.getElementById('serviceList');
            list.innerHTML = '';
            
            services.forEach(service => {
                const item = document.createElement('div');
                item.className = 'service-item';
                item.innerHTML = `
                    <div class="service-name">${service.name}</div>
                    <div class="service-status">
                        <span>URL: ${service.url}</span>
                        <span class="status-badge status-${service.status}">${service.status}</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Render events
        function renderEvents() {
            const log = document.getElementById('eventsLog');
            log.innerHTML = '';
            
            events.slice().reverse().forEach(event => {
                const item = document.createElement('div');
                item.className = 'event-item';
                item.innerHTML = `
                    <div class="event-time">${new Date(event.timestamp).toLocaleString()}</div>
                    <div><strong>${event.source_service}</strong> → <strong>${event.target_service}</strong></div>
                    <div>Type: ${event.event_type}</div>
                    ${event.data ? `<div>Data: ${JSON.stringify(event.data)}</div>` : ''}
                `;
                log.appendChild(item);
            });
        }

        // Update target instance select
        function updateTargetSelect() {
            const select = document.getElementById('targetInstance');
            select.innerHTML = '<option value="">Sélectionner une instance...</option>';
            
            instances.forEach(instance => {
                if (instance.name !== currentInstance.instance_id) {
                    const option = document.createElement('option');
                    option.value = instance.name;
                    option.textContent = `${instance.name} (${instance.url})`;
                    select.appendChild(option);
                }
            });
        }

        // Send message to another instance
        async function sendMessage() {
            const target = document.getElementById('targetInstance').value;
            const message = document.getElementById('message').value.trim();

            if (!target || !message) {
                alert('Veuillez sélectionner une instance et entrer un message');
                return;
            }

            try {
                const response = await fetch('/api/communicate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ target, message })
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`Message envoyé à ${target}: ${result.status}`);
                    
                    // Clear form
                    document.getElementById('message').value = '';
                    
                    // Reload data to show new events
                    loadData();
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                alert('Erreur de communication: ' + error.message);
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadInstanceInfo();
            loadData();
            
            // Auto-refresh every 30 seconds
            setInterval(loadData, 30000);
        });
    </script>
</body>
</html>
